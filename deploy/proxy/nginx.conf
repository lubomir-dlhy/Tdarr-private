map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 0;

  # Only the page's own origin is reachable; this stops the UI's direct calls to api.tdarr.io and jsDelivr.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /_private/ {
    alias /srv/private/;
    expires 7d;
  }

  location / {
    proxy_pass http://tdarr-server:8265;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<script src="./_private/monaco-preload.js"></script></head>';
  }
}
